<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a0f"><title>Atualizando CAPTAUP</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05090f;color:#eaf7ff;font-family:Arial,sans-serif}.box{max-width:420px;padding:28px;text-align:center}.spin{width:42px;height:42px;border:3px solid #17334a;border-top-color:#39a9ff;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#8aa7ba}</style></head><body><div class="box"><div class="spin"></div><h2>Atualizando CAPTAUP</h2><small>Limpando a versão antiga e abrindo a base de 23/08...</small></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}}catch(e){}setTimeout(()=>location.replace('./?v=clean2308-v22-'+Date.now()),700)})();</script></body></html>
