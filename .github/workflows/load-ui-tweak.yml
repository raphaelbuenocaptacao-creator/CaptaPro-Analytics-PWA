name: Load FluxoHub UI tweak
on:
  push:
    branches: [main]
    paths:
      - 'ui-tweak.js'
      - '.github/workflows/load-ui-tweak.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject UI script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="ui-tweak.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit UI script injection
        run: |
          git config user.name 'FluxoHub Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load FluxoHub UI polish'
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/load-ui-tweak.yml
          git add .github/workflows/load-ui-tweak.yml
          git commit -m 'Remove one-time UI patch workflow' || true
          git push || true
