name: Add official VGV check
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Add official VGV reconciliation check'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch fix.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fix.js')
          s=p.read_text()
          marker="function renderKPIs(a){let z=baseStats(a);"
          fn="""\nconst OFFICIAL_VGV=61700089.96;\nconst VGV_TOLERANCE=0.01;\nfunction renderVgvCheck(v){let diff=v-OFFICIAL_VGV;let ok=Math.abs(diff)<=VGV_TOLERANCE;let e=document.getElementById('vgvCheck');if(!e){e=document.createElement('div');e.id='vgvCheck';e.style.margin='10px 0';let grid=document.querySelector('#page-visao .grid');if(grid)grid.insertBefore(e,grid.firstChild);}e.className=ok?'info':'alert';e.innerHTML=ok?'✅ <b>VGV conferido.</b> Sistema: '+money(v)+' · Oficial: '+money(OFFICIAL_VGV)+'.':'⚠️ <b>Divergência de VGV.</b> Sistema: '+money(v)+' · Oficial: '+money(OFFICIAL_VGV)+' · Diferença: '+money(Math.abs(diff))+'.';}\n"""
          if 'const OFFICIAL_VGV=61700089.96' not in s:
              s=s.replace("let data=[];", "let data=[];"+fn)
          if 'renderVgvCheck(z.v);' not in s:
              s=s.replace(marker, marker+'renderVgvCheck(z.v);')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fix.js
          git diff --cached --quiet || git commit -m 'Add official VGV reconciliation check'
          git push
