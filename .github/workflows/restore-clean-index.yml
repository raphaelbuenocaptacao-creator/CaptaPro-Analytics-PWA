name: Restore clean FluxoHub index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[clean-index]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good index
        run: |
          git checkout c831bb439605534a8c0f31c183f11bc948f1c7a8 -- index.html
      - name: Commit clean index
        run: |
          git config user.name 'raphaelbuenocaptacao-creator'
          git config user.email 'raphaelbueno.captacao@gmail.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore clean FluxoHub index [clean-index]'
          git push
