name: Consolidar base CAPTAUP 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-2026.yml'
      - 'tools/consolidate_2026.py'
      - 'data-extra-2026-08-23.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidar base anual e limpar antigas
        run: python tools/consolidate_2026.py
      - name: Publicar base unica
        run: |
          git config user.name 'captaup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Base oficial unica CAPTAUP - notorio 24-08-2026'
          git push
