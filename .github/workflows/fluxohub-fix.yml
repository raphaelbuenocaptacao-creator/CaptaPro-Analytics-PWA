name: FluxoHub one-time PWA fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !contains(github.event.head_commit.message, '[fluxohub-pwa-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register Service Worker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "navigator.serviceWorker.register('./sw.js')"
          if marker not in s:
              inject = """\n<script>\nif ('serviceWorker' in navigator) {\n  window.addEventListener('load', () => {\n    navigator.serviceWorker.register('./sw.js').catch(() => {});\n  });\n}\n</script>\n"""
              s = s.replace('</body>', inject + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed."
            exit 0
          fi
          git commit -m "fix: registrar service worker do FluxoHub [fluxohub-pwa-fixed]"
          git push
